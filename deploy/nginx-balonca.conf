# Static hosting for Balonca on your VPS.
#   1. Point DNS (A record) for balonca.example.com to 203.0.113.10
#   2. npm run build, then rsync dist/ to /var/www/balonca/ (see README "Deploy")
#   3. sudo cp deploy/nginx-balonca.conf /etc/nginx/sites-available/balonca
#      sudo ln -s /etc/nginx/sites-available/balonca /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d balonca.example.com     (adds HTTPS + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name balonca.example.com;

    root /var/www/balonca;
    index index.html;

    # Same policy as the <meta> tag in index.html, as a real header (frame-ancestors only works as a header).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: https://i.ytimg.com; style-src 'self'; font-src 'self'; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hashed build assets never change: cache forever. index.html must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header is not inherited once a location sets its own, so repeat the security ones.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: https://i.ytimg.com; style-src 'self'; font-src 'self'; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
